<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1000" width="1760" height="1000" font-family="Inter, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 30px Inter, 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 16px Inter, 'Segoe UI', Arial, sans-serif; fill: #475569; }
    .zone rect { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .zone.untrusted rect { fill: #fff7ed; stroke: #fb923c; stroke-dasharray: 7 5; }
    .zone.exec rect { fill: #fef2f2; stroke: #f87171; stroke-dasharray: 7 5; }
    .zone.go rect { fill: #eff6ff; stroke: #60a5fa; }
    .zone.node rect { fill: #f0fdf4; stroke: #4ade80; }
    .zone.ext rect { fill: #f5f3ff; stroke: #a78bfa; }
    .zone text.zt { font: 700 15px Inter, 'Segoe UI', Arial, sans-serif; fill: #334155; letter-spacing: .06em; }
    .zone text.zs { font: 400 12.5px Inter, 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    .box rect { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .box.key rect { stroke: #2563eb; stroke-width: 2; }
    .box.sec rect { stroke: #dc2626; stroke-width: 2; }
    .box.data rect { stroke: #7c3aed; stroke-width: 2; }
    .box text.t { font: 700 14.5px Inter, 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .box text.s { font: 400 12px Inter, 'Segoe UI', Arial, sans-serif; fill: #475569; }
    .ln { fill: none; stroke: #334155; stroke-width: 1.6; }
    .ln.dash { stroke-dasharray: 6 5; }
    .ln.sec { stroke: #dc2626; }
    .ln.data { stroke: #7c3aed; }
    .lbl { font: 600 11.5px Inter, 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .lbl.bg2 { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .note { font: 400 13px Inter, 'Segoe UI', Arial, sans-serif; fill: #7c2d12; }
    .legend text { font: 400 13px Inter, 'Segoe UI', Arial, sans-serif; fill: #334155; }
  </style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect class="bg" width="1760" height="1000"/><text class="title" x="40" y="52">Architect 2.0 in the cloud: deployment and scaling (proposed)</text><text class="subtitle" x="40" y="80">How the same design scales to thousands of concurrent builders. Today Jr Architect runs on one host; this is the target, not the current deployment.</text><g class="zone untrusted"><rect x="30" y="110" width="230" height="860" rx="16"/><text class="zt" x="48" y="138">USERS</text></g><g class="box "><rect x="45" y="200" width="200" height="70" rx="10"/><text class="t" x="145.0" y="231.5" text-anchor="middle">Browser</text><text class="s" x="145.0" y="249.5" text-anchor="middle">builders and developers</text></g><g class="box "><rect x="45" y="300" width="200" height="70" rx="10"/><text class="t" x="145.0" y="331.5" text-anchor="middle">Generated apps</text><text class="s" x="145.0" y="349.5" text-anchor="middle">their end users</text></g><g class="box "><rect x="45" y="400" width="200" height="70" rx="10"/><text class="t" x="145.0" y="431.5" text-anchor="middle">n8n, CI, webhooks</text><text class="s" x="145.0" y="449.5" text-anchor="middle">bearer tokens</text></g><g class="zone "><rect x="290" y="110" width="230" height="860" rx="16"/><text class="zt" x="308" y="138">EDGE</text></g><g class="box "><rect x="305" y="180" width="200" height="90" rx="10"/><text class="t" x="405.0" y="213.0" text-anchor="middle">CDN + WAF</text><text class="s" x="405.0" y="231.0" text-anchor="middle">static UI, TLS,</text><text class="s" x="405.0" y="247.0" text-anchor="middle">bot and DDoS rules</text></g><g class="box key"><rect x="305" y="290" width="200" height="80" rx="10"/><text class="t" x="405.0" y="318.0" text-anchor="middle">Wildcard DNS</text><text class="s" x="405.0" y="336.0" text-anchor="middle">*.app.example.com</text><text class="s" x="405.0" y="352.0" text-anchor="middle">per-app preview hosts</text></g><g class="box "><rect x="305" y="400" width="200" height="90" rx="10"/><text class="t" x="405.0" y="433.0" text-anchor="middle">Load balancer</text><text class="s" x="405.0" y="451.0" text-anchor="middle">HTTP/2, WebSocket</text><text class="s" x="405.0" y="467.0" text-anchor="middle">sticky only for terminals</text></g><g class="zone go"><rect x="550" y="110" width="560" height="420" rx="16"/><text class="zt" x="568" y="138">STATELESS SERVICES (AUTOSCALED)</text><text class="zs" x="568" y="157">any replica can serve any request</text></g><g class="box sec"><rect x="570" y="170" width="250" height="100" rx="10"/><text class="t" x="695.0" y="199.5" text-anchor="middle">Go API (N replicas)</text><text class="s" x="695.0" y="217.5" text-anchor="middle">auth, sessions, ownership,</text><text class="s" x="695.0" y="233.5" text-anchor="middle">policy, rate limits, REST + WS,</text><text class="s" x="695.0" y="249.5" text-anchor="middle">audit events</text></g><g class="box key"><rect x="840" y="170" width="250" height="100" rx="10"/><text class="t" x="965.0" y="199.5" text-anchor="middle">Preview router (N)</text><text class="s" x="965.0" y="217.5" text-anchor="middle">host -&gt; sandbox lookup,</text><text class="s" x="965.0" y="233.5" text-anchor="middle">proxies HTTP and WS</text><text class="s" x="965.0" y="249.5" text-anchor="middle">to the right sandbox host</text></g><g class="box "><rect x="570" y="290" width="250" height="100" rx="10"/><text class="t" x="695.0" y="319.5" text-anchor="middle">Agent workers (N)</text><text class="s" x="695.0" y="337.5" text-anchor="middle">IDE chat, Planning mode,</text><text class="s" x="695.0" y="353.5" text-anchor="middle">OpenGAP, Hub runs, workflows;</text><text class="s" x="695.0" y="369.5" text-anchor="middle">pull jobs from the queue</text></g><g class="box "><rect x="840" y="290" width="250" height="100" rx="10"/><text class="t" x="965.0" y="319.5" text-anchor="middle">Build workers (N)</text><text class="s" x="965.0" y="337.5" text-anchor="middle">Build mode: plan, codegen,</text><text class="s" x="965.0" y="353.5" text-anchor="middle">heal; long jobs off the</text><text class="s" x="965.0" y="369.5" text-anchor="middle">request path</text></g><g class="box key"><rect x="570" y="410" width="520" height="100" rx="10"/><text class="t" x="830.0" y="439.5" text-anchor="middle">Model gateway</text><text class="s" x="830.0" y="457.5" text-anchor="middle">one place for provider keys, per-user and per-key budgets,</text><text class="s" x="830.0" y="473.5" text-anchor="middle">retries and fallbacks across Groq, OpenAI, Anthropic, Gemini,</text><text class="s" x="830.0" y="489.5" text-anchor="middle">token metering for billing</text></g><g class="zone exec"><rect x="550" y="560" width="560" height="410" rx="16"/><text class="zt" x="568" y="588">SANDBOX FLEET</text><text class="zs" x="568" y="607">untrusted code only; no credentials, no control plane access</text></g><g class="box sec"><rect x="570" y="620" width="250" height="110" rx="10"/><text class="t" x="695.0" y="654.5" text-anchor="middle">Sandbox scheduler</text><text class="s" x="695.0" y="672.5" text-anchor="middle">places sandboxes on hosts by</text><text class="s" x="695.0" y="688.5" text-anchor="middle">free CPU, memory and disk;</text><text class="s" x="695.0" y="704.5" text-anchor="middle">enforces per-user quotas</text></g><g class="box sec"><rect x="840" y="620" width="250" height="110" rx="10"/><text class="t" x="965.0" y="654.5" text-anchor="middle">Sandbox hosts (M)</text><text class="s" x="965.0" y="672.5" text-anchor="middle">Firecracker microVMs (or gVisor)</text><text class="s" x="965.0" y="688.5" text-anchor="middle">per project: own kernel, CPU,</text><text class="s" x="965.0" y="704.5" text-anchor="middle">memory, disk and egress policy</text></g><g class="box "><rect x="570" y="750" width="250" height="100" rx="10"/><text class="t" x="695.0" y="779.5" text-anchor="middle">Warm pools</text><text class="s" x="695.0" y="797.5" text-anchor="middle">pre-booted VMs per stack image,</text><text class="s" x="695.0" y="813.5" text-anchor="middle">so a new sandbox starts</text><text class="s" x="695.0" y="829.5" text-anchor="middle">in about a second</text></g><g class="box sec"><rect x="840" y="750" width="250" height="100" rx="10"/><text class="t" x="965.0" y="779.5" text-anchor="middle">Git credential runners</text><text class="s" x="965.0" y="797.5" text-anchor="middle">short-lived, token injected</text><text class="s" x="965.0" y="813.5" text-anchor="middle">per operation, never inside</text><text class="s" x="965.0" y="829.5" text-anchor="middle">a project sandbox</text></g><g class="box "><rect x="570" y="870" width="520" height="80" rx="10"/><text class="t" x="830.0" y="898.0" text-anchor="middle">Workspace storage</text><text class="s" x="830.0" y="916.0" text-anchor="middle">a block volume per active sandbox; snapshots to object storage when idle,</text><text class="s" x="830.0" y="932.0" text-anchor="middle">restored on reopen, so idle sandboxes cost nothing</text></g><g class="zone ext"><rect x="1140" y="110" width="590" height="860" rx="16"/><text class="zt" x="1158" y="138">STATE AND PLATFORM</text></g><g class="box data"><rect x="1160" y="170" width="270" height="110" rx="10"/><text class="t" x="1295.0" y="204.5" text-anchor="middle">MongoDB Atlas</text><text class="s" x="1295.0" y="222.5" text-anchor="middle">replica set, sharded by owner:</text><text class="s" x="1295.0" y="238.5" text-anchor="middle">users, projects, agents,</text><text class="s" x="1295.0" y="254.5" text-anchor="middle">workflows, runs, audit log</text></g><g class="box data"><rect x="1445" y="170" width="270" height="110" rx="10"/><text class="t" x="1580.0" y="204.5" text-anchor="middle">Redis</text><text class="s" x="1580.0" y="222.5" text-anchor="middle">sessions (revocable), rate</text><text class="s" x="1580.0" y="238.5" text-anchor="middle">limits, sandbox -&gt; host map,</text><text class="s" x="1580.0" y="254.5" text-anchor="middle">preview routing cache</text></g><g class="box "><rect x="1160" y="300" width="270" height="100" rx="10"/><text class="t" x="1295.0" y="329.5" text-anchor="middle">Job queue</text><text class="s" x="1295.0" y="347.5" text-anchor="middle">NATS or Redis Streams:</text><text class="s" x="1295.0" y="363.5" text-anchor="middle">builds, agent runs, git jobs;</text><text class="s" x="1295.0" y="379.5" text-anchor="middle">pending, running, done, failed</text></g><g class="box "><rect x="1445" y="300" width="270" height="100" rx="10"/><text class="t" x="1580.0" y="338.0" text-anchor="middle">Object storage</text><text class="s" x="1580.0" y="356.0" text-anchor="middle">workspace snapshots,</text><text class="s" x="1580.0" y="372.0" text-anchor="middle">build artefacts, exports</text></g><g class="box sec"><rect x="1160" y="420" width="270" height="100" rx="10"/><text class="t" x="1295.0" y="449.5" text-anchor="middle">Secrets</text><text class="s" x="1295.0" y="467.5" text-anchor="middle">KMS-wrapped keys for GitHub</text><text class="s" x="1295.0" y="483.5" text-anchor="middle">tokens and provider keys;</text><text class="s" x="1295.0" y="499.5" text-anchor="middle">rotated, never in images</text></g><g class="box "><rect x="1445" y="420" width="270" height="100" rx="10"/><text class="t" x="1580.0" y="449.5" text-anchor="middle">Observability</text><text class="s" x="1580.0" y="467.5" text-anchor="middle">OpenTelemetry traces, JSON logs,</text><text class="s" x="1580.0" y="483.5" text-anchor="middle">metrics per sandbox, model</text><text class="s" x="1580.0" y="499.5" text-anchor="middle">and user; alerts</text></g><g class="box "><rect x="1160" y="540" width="555" height="90" rx="10"/><text class="t" x="1437.5" y="573.0" text-anchor="middle">GitHub and model providers</text><text class="s" x="1437.5" y="591.0" text-anchor="middle">GitHub App (fine-grained, per-repo install) instead of user OAuth tokens;</text><text class="s" x="1437.5" y="607.0" text-anchor="middle">provider APIs reached only through the model gateway</text></g><g class="box "><rect x="1160" y="650" width="555" height="130" rx="10"/><text class="t" x="1437.5" y="686.0" text-anchor="middle">Deploying users' apps</text><text class="s" x="1437.5" y="704.0" text-anchor="middle">one click from the IDE: build in a sandbox, push the image to a registry,</text><text class="s" x="1437.5" y="720.0" text-anchor="middle">run it on a managed runtime (Cloud Run, Fly.io or a Kubernetes namespace)</text><text class="s" x="1437.5" y="736.0" text-anchor="middle">with its own URL, env vars from the secrets store, and the app's agents</text><text class="s" x="1437.5" y="752.0" text-anchor="middle">and workflows reached through the same API with per-app tokens</text></g><g class="box "><rect x="1160" y="800" width="555" height="150" rx="10"/><text class="t" x="1437.5" y="837.5" text-anchor="middle">How it scales</text><text class="s" x="1437.5" y="855.5" text-anchor="middle">API, agents and builds scale on CPU and queue depth; sandbox hosts</text><text class="s" x="1437.5" y="871.5" text-anchor="middle">scale on free capacity; MongoDB shards by owner; Redis holds hot</text><text class="s" x="1437.5" y="887.5" text-anchor="middle">routing only; previews scale with the router fleet. A user's limits</text><text class="s" x="1437.5" y="903.5" text-anchor="middle">(sandboxes, model calls, tokens, disk) are enforced in the API and</text><text class="s" x="1437.5" y="919.5" text-anchor="middle">the scheduler, so one user cannot starve the rest.</text></g><path class="ln " d="M245,235 L305,225" marker-end="url(#arr)"/><path class="ln " d="M245,335 L305,335" marker-end="url(#arr)"/><path class="ln " d="M245,435 L305,445" marker-end="url(#arr)"/><path class="ln " d="M505,445 L535,445 L535,220 L570,220" marker-end="url(#arr)"/><text class="lbl" x="405" y="510" text-anchor="middle">API + WS</text><path class="ln " d="M695,270 L695,290" marker-end="url(#arr)"/><path class="ln " d="M695,390 L695,410" marker-end="url(#arr)"/><path class="ln " d="M570,250 L560,250 L560,675 L570,675" marker-end="url(#arr)"/><text class="lbl" x="580" y="548" text-anchor="start">create, stop sandboxes</text><path class="ln " d="M820,675 L840,675" marker-end="url(#arr)"/><path class="ln sec" d="M1090,220 L1125,220 L1125,690 L1090,690" marker-end="url(#arr)"/><path class="ln data" d="M1110,150 L1140,150" marker-end="url(#arr)"/><text class="lbl" x="1125" y="140" text-anchor="middle">state</text><path class="ln sec" d="M1090,800 L1132,800 L1132,585 L1160,585" marker-end="url(#arr)"/><text class="lbl" x="405" y="395" text-anchor="middle">-&gt; preview router</text></svg>