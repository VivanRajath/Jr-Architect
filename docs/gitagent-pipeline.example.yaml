# Example GitAgent pipeline: save as .gitagent/pipeline.yaml to run registry agents in the Developer and Guardrails slots.

spec_version: 0.1.0

pipeline:
  # The Developer slot. A registry developer agent drives the whole-file rewrite via the `system-prompt` adapter (its SOUL/RULES/skill become the persona).
  developer: shreyas-lyzr/architect

  # The Guardrails slot. Stack one or more registry guardrail agents on top of the built-in secret/lockfile guard.
  guardrails:
    - builtin:secret-sentinel
    # - your-author/your-guardrail-agent

# Without a manifest, set GITAGENT_DEVELOPER_AGENT=author/name and GITAGENT_GUARDRAIL_AGENTS=a/b,c/d instead.
