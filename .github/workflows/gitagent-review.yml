# Run this repository's own GitAgent pipeline against every pull request.
#
# The rules are not configured here. They live in `.gitagent/` — the repo's own
# compliance file plus whatever packs `.gitagent/pipeline.json` pulls from the
# registry. Change the rules by committing a change to those files; this workflow
# never needs editing.
#
# That is the point of the whole design: the agent is a property of the repository,
# so the same rules apply in the IDE, on a teammate's laptop, and here.

name: GitAgent review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # Needed for the ::error:: annotations to attach to files in the Files tab.
  checks: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The review diffs base...head, so it needs both sides. A shallow clone
          # has neither merge base nor history and every file reads as new.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the agent service
        working-directory: agent-services
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Review the diff against this repo's guardrails
        working-directory: agent-services
        env:
          # Any one provider is enough. Without a key the code-level floor still
          # runs and still gates — secrets and protected paths are refused with no
          # model involved at all.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # In CI an unreachable pack must NOT wave the change through. The IDE
          # defaults to fail-open so a provider outage can't wedge someone's
          # editor; a merge gate has the opposite priority.
          GITAGENT_GUARDRAIL_FAIL: closed
        run: |
          node cli.js review \
            --dir .. \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --message "${{ github.event.pull_request.title }}" \
            --github

      # The decisions are written to .gitagent/audit/<date>.jsonl. Keeping them as
      # an artifact means "what was enforced, on which commit, by which pack" is
      # answerable months later without re-running anything.
      - name: Keep the decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitagent-audit-${{ github.event.pull_request.number }}
          path: .gitagent/audit/
          if-no-files-found: ignore
