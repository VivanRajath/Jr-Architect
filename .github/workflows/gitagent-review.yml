# Runs this repo's own GitAgent pipeline on every pull request.
# The rules live in .gitagent/, not here — this workflow never needs editing.

name: GitAgent review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # Needed for the ::error:: annotations to attach to files in the Files tab.
  checks: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # base...head needs both sides; a shallow clone has neither

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the agent service
        working-directory: agent-services
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Review the diff against this repo's guardrails
        working-directory: agent-services
        env:
          # Without a key the code floor still runs and still gates.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # A merge gate must not wave a change through when a pack is unreachable.
          GITAGENT_GUARDRAIL_FAIL: closed
        run: |
          node cli.js review \
            --dir .. \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --message "${{ github.event.pull_request.title }}" \
            --github

      # Keeps "what was enforced, on which commit, by which pack" answerable later.
      - name: Keep the decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitagent-audit-${{ github.event.pull_request.number }}
          path: .gitagent/audit/
          if-no-files-found: ignore
