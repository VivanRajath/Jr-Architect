<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Editor - Jr Architect</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181B%27/%3E%3Ctext x=%2716%27 y=%2721.5%27 font-family=%27Arial,sans-serif%27 font-size=%2714%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23FAFAFA%27%3EJr%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/hub.css" />
  <link rel="stylesheet" href="/css/flows.css" />
</head>

<body class="h-page f-page dark-mode">
  <header class="h-top f-top">
    <button class="h-btn h-btn-ghost h-btn-sm" onclick="goBack('/hub.html#workflows')">&larr; Back</button>
    <div class="h-brand">
      <a href="/hub.html#workflows">Agent Hub</a>
      <input id="f-name" class="f-name" aria-label="Workflow name" value="New workflow">
    </div>
    <span class="h-pill" id="f-version" hidden></span>
    <span class="s-dirty" id="f-dirty" hidden>Unsaved changes</span>
    <span class="h-spacer"></span>
    <button class="h-btn h-btn-ghost h-btn-sm" id="f-runs-btn">Executions</button>
    <button class="h-btn h-btn-ghost h-btn-sm" id="f-hook-btn" title="Call this workflow from your own apps">API</button>
    <button class="h-btn h-btn-ghost h-btn-sm" id="f-playground-btn" title="Chat with the saved version of this workflow">Playground</button>
    <button class="h-btn h-btn-ok" id="f-run">Run workflow</button>
    <button class="h-btn" id="f-save">Save</button>
  </header>

  <div class="f-shell" id="f-shell">
    <aside class="f-palette" id="f-palette" aria-label="Nodes"></aside>
    <main class="f-canvas" id="f-canvas" tabindex="0" aria-label="Workflow canvas">
      <div class="f-world" id="f-world">
        <svg class="f-edges" id="f-edges" aria-hidden="true"></svg>
      </div>
      <div class="f-banner" id="f-banner" hidden></div>
      <div class="f-hint" id="f-hint" hidden>Drag nodes from the left onto the canvas, then connect a node's right dot to another node.<br>Scroll to move around, Ctrl + scroll to zoom, right-click for more.</div>
      <button class="f-tool f-toggle right" id="f-toggle-panel" type="button" data-icon="panelRight"></button>
      <div class="f-tools">
        <button class="f-tool" id="f-zoom-out" type="button" aria-label="Zoom out" title="Zoom out (Ctrl + scroll)" data-icon="minus"></button>
        <button class="f-zoom" id="f-zoom" type="button" title="Zoom to 100%">100%</button>
        <button class="f-tool" id="f-zoom-in" type="button" aria-label="Zoom in" title="Zoom in (Ctrl + scroll)" data-icon="plus"></button>
        <span class="f-tools-sep"></span>
        <button class="f-tool" id="f-fit" type="button" aria-label="Fit to screen" title="Fit to screen" data-icon="fit"></button>
      </div>
      <div class="f-bin" id="f-bin">
        <button class="f-tool f-bin-btn" id="f-bin-btn" type="button" title="Bin: drag a node here to remove it. Click to restore." aria-label="Bin"><span data-icon="trash"></span><span class="f-bin-count" id="f-bin-count" hidden></span></button>
      </div>
    </main>
    <aside class="f-panel" id="f-side">
      <div class="f-panel-body" id="f-panel"></div>
    </aside>
  </div>

  <script src="/js/shell.js"></script>
  <script src="/js/hub-common.js"></script>
  <script src="/js/flow-editor.js"></script>
</body>

</html>
